<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Flag Quiz Game</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7924864277518239"
crossorigin="anonymous"></script>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e40af);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:95%;
max-width:420px;
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:20px;
text-align:center;
}

.option{
background:rgba(255,255,255,0.2);
margin:8px;
padding:12px;
border-radius:10px;
cursor:pointer;
}

.correct{background:green;}
.wrong{background:red;}

.btn{
padding:10px 15px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.ad-box{margin:10px 0;}
</style>
</head>

<body>

<div class="container">

<h2>💰 Money Flag Quiz</h2>

<p>Coins: <span id="coins">0</span></p>
<p>Score: <span id="score">0</span></p>

<!-- 🔥 TOP AD -->
<div class="ad-box">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-7924864277518239"
data-ad-slot="2444161086"
data-ad-format="auto"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<button class="btn" onclick="setLevel('easy')">Easy</button>
<button class="btn" onclick="setLevel('medium')">Medium</button>
<button class="btn" onclick="setLevel('hard')">Hard</button>

<div id="quiz"></div>
<div id="options"></div>

<button class="btn" onclick="watchRewardAd()">🎁 Reward Ad</button>

<!-- 🔥 MID AD -->
<div class="ad-box">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-7924864277518239"
data-ad-slot="5881679969"
data-ad-format="fluid"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<div id="result" style="display:none;">
<h2>Game Over</h2>
<p id="final"></p>

<!-- 🔥 RESULT AD -->
<div class="ad-box">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-7924864277518239"
data-ad-slot="9072161537"
data-ad-format="auto"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<button class="btn" onclick="location.reload()">Play Again</button>
</div>

</div>

<script>
const flags=[
{code:"af",name:"Afghanistan"},
{code:"pk",name:"Pakistan"},
{code:"us",name:"United States"},
{code:"in",name:"India"},
{code:"jp",name:"Japan"},
{code:"fr",name:"France"}
];

let coins=0;
let score=0;
let qIndex=0;
let questions=[];
let answered=false;
let adCounter=0;
let level="easy";

function shuffle(a){return a.sort(()=>Math.random()-0.5);}

function setLevel(l){
level=l;
startGame();
}

function startGame(){
coins=0;
score=0;
qIndex=0;
questions=[];

generate();
loadQ();
dailyBonus();
}

function generate(){
let pool=shuffle([...flags]);

let total= level==="easy"?20: level==="medium"?50:100;

for(let i=0;i<total;i++){
let correct=pool[i%pool.length];
let wrong=shuffle(flags.filter(f=>f.code!==correct.code)).slice(0,3);

questions.push({
correct,
options:shuffle([correct,...wrong])
});
}
}

function loadQ(){
if(qIndex>=questions.length){
endGame();
return;
}

answered=false;

let q=questions[qIndex];
let box=document.getElementById("options");
box.innerHTML="";

document.getElementById("quiz").innerHTML="Q "+(qIndex+1);

q.options.forEach(o=>{
let div=document.createElement("div");
div.className="option";
div.innerText=o.name;
div.onclick=()=>check(o.code,div);
box.appendChild(div);
});
}

function check(code,el){
if(answered)return;
answered=true;

let q=questions[qIndex];

if(code===q.correct.code){
score++;
coins+=10;
el.classList.add("correct");
}else{
coins=Math.max(0,coins-5);
el.classList.add("wrong");
}

document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=coins;

adCounter++;

/* 💰 AD EVERY 3 QUESTIONS */
setTimeout(()=>{
if(adCounter%3===0){
(adsbygoogle=window.adsbygoogle||[]).push({});
}
I'm
qIndex++;
loadQ();
},1000);
}

function watchRewardAd(){
if(coins>=50){
alert("Reward Ad Playing...");
(adsbygoogle=window.adsbygoogle||[]).push({});
coins+=30;
document.getElementById("coins").innerText=coins;
}else{
alert("Need 50 coins");
}
}

function endGame(){
document.getElementById("result").style.display="block";
document.getElementById("final").innerText=
"Score: "+score+" | Coins: "+coins;
}

function dailyBonus(){
let last=localStorage.getItem("last");
let today=new Date().toDateString();

if(last!==today){
coins+=50;
localStorage.setItem("last",today);
}
}
</script>

</body>
    </html>
